services:
  - type: web
    name: iappoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: APP_NAME
        value: iAppoint
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: iappoint
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: iappoint-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iappoint-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: iappoint-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: iappoint-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iappoint-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: iappoint-db
    databaseName: iappoint
    user: iappoint
    region: singapore
    plan: free
