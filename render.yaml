services:
  - type: web
    name: iappoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: APP_NAME
        value: iAppoint
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: iappoint
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: iappoint-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iappoint-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: iappoint-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: iappoint-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iappoint-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        value: albonjayvee39@gmail.com
      - key: MAIL_PASSWORD
        value: utepahfleoyagvap
      - key: MAIL_FROM_ADDRESS
        value: albonjayvee39@gmail.com
      - key: MAIL_FROM_NAME
        value: iAppoint
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: iappoint-db
    databaseName: iappoint
    user: iappoint
    region: singapore
    plan: free
