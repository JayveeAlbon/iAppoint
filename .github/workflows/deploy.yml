name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────
  # Deploy to Railway
  # Requires: RAILWAY_TOKEN secret in GitHub repo
  # ─────────────────────────────────────────────
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_TARGET == 'railway' || vars.DEPLOY_TARGET == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────
  # Deploy to Render
  # Requires: RENDER_DEPLOY_HOOK_URL secret
  # (Get this from Render dashboard → your service → Deploy Hook)
  # ─────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_TARGET == 'render' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered successfully."

  # ─────────────────────────────────────────────
  # Deploy to Fly.io
  # Requires: FLY_API_TOKEN secret in GitHub repo
  # ─────────────────────────────────────────────
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_TARGET == 'fly' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
